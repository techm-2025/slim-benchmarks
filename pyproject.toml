[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-benchmarks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["slim-bindings==1.3.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "nats-py>=2.14",
    "grpcio>=1.80",
    "grpcio-tools>=1.80",
    "paho-mqtt>=2.1",
    "kafka-python>=2.3",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["slim_bench*"]
