[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-a2a-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "slima2a==0.6.0",
    "a2a-sdk[sqlite,telemetry]==1.0.0-alpha.0",
    "slim-bindings==1.4.1",
    "packaging",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*"]
